name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e  # Exit immediately if any command fails

            cd /opt/knowledge_map/dev5_cust3
            git pull origin main
            /opt/knowledge_map/venv/bin/pip install -r knowledge_map/requirements.txt

            cd knowledge_map
            export DJANGO_SETTINGS_MODULE=knowledge_map.settings.prod
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            export DEBUG=False
            export DJANGO_ALLOWED_HOSTS=yourknowledgemap.me
            export DB_NAME="${{ secrets.DB_NAME }}"
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_HOST="${{ secrets.DB_HOST }}"
            export DB_PORT="${{ secrets.DB_PORT }}"
            export DB_SSLMODE="${{ secrets.DB_SSLMODE }}"
            export CELERY_BROKER_URL="${{ secrets.CELERY_BROKER_URL }}"
            export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"

            # Run Django checks before deploying
            echo "Running Django system check..."
            /opt/knowledge_map/venv/bin/python manage.py check --deploy 2>&1 | grep -v "^System check" || true

            echo "Running migrations..."
            /opt/knowledge_map/venv/bin/python manage.py migrate --noinput

            echo "Collecting static files..."
            /opt/knowledge_map/venv/bin/python manage.py collectstatic --noinput --clear

            echo "Restarting services..."
            sudo systemctl restart gunicorn
            sudo systemctl restart celery

            # Wait for gunicorn to come up
            echo "Waiting for gunicorn to start..."
            sleep 5

            # Test that key pages are responding
            echo "Testing key pages..."
            
            test_page() {
              local url=$1
              local name=$2
              local status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000$url)
              if [ "$status" = "200" ] || [ "$status" = "302" ]; then
                echo "  ✓ $name ($status)"
              else
                echo "  ✗ $name returned $status - DEPLOY FAILED"
                sudo systemctl status gunicorn --no-pager -n 20
                exit 1
              fi
            }

            test_page "/" "Homepage"
            test_page "/accounts/login/" "Login page"
            test_page "/upload/" "Upload page (redirect to login)"
            test_page "/quizzes/" "Quizzes page (redirect to login)"
            test_page "/maps/" "Maps page (redirect to login)"

            echo "All checks passed - deploy successful!"
