name: Django Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install celery redis django-celery-results behave pip-audit
          pip install -r requirements.txt
          pip install coverage

      - name: Run dependency vulnerability scan
        run: |
         # run pip-audit against requirements.txt, output results as JSON
         # --format json flagoutputs machine readable results
         # -o flag saves report to file
         # report vulnerabilities without blocking build
         pip-audit -r requirements.txt --format json -o dependency-scan-report.json || true

         # run pip audit again without JSON for human-readable in github actions
         pip-audit -r requirements.txt || true
      
      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          # name artifact with Python version so each matrix has own report
          name: dependency-scan-report${{ matrix.python-version }}
          #file to upload made by pip audit
          path: dependency-scan-report.json
          # if JSON not created, give warning, don't fail
          if-no-files-found: warn

      - name: Run Django tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: knowledge_map.settings.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: | 
          cd knowledge_map
          coverage run --source='.' manage.py test

      - name: Run Behave tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: knowledge_map.settings.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd knowledge_map
          coverage run --source='knowledge_app' --append -m behave features

      - name: Enforce 80% coverage
        run: |
          cd knowledge_map
          coverage report -m --fail-under=80

      - name: Generate XML report
        run: |
         cd knowledge_map
         coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4

