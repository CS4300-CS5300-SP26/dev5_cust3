{% extends "knowledge_app/base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/homepage.css' %}?v=2">
{% endblock %}

{% block content %}
<div class="builder-wrapper">

    <!-- Toolbar -->
    <div class="builder-toolbar">
        <!-- Editable map title -->
        <input type="text" id="map-title" class="map-title-input" value="{{ custom_map.title }}">

        <!-- Action buttons -->
        <button id="add-node-btn" class="toolbar-btn">+ Add Node</button>
        <button id="add-edge-btn" class="toolbar-btn edge-btn">+ Add Connection</button>
        <button id="clear-btn" class="toolbar-btn clear-btn">Clear All</button>
    </div>

    <!-- Add node form (hidden by default) -->
    <div id="add-node-form" class="add-node-form hidden">
        <input type="text" id="new-node-label" placeholder="Node label (required)">
        <input type="text" id="new-node-summary" placeholder="Node summary (optional)">
        <button id="confirm-add-node" class="confirm-btn">Add</button>
        <button id="cancel-add-node" class="cancel-btn">Cancel</button>
    </div>

    <!-- Cytoscape canvas -->
    <div id="cy"></div>

    <!-- Node popup -->
    <div id="node-popup" class="node-popup hidden">
        <button id="popup-close" class="popup-close">✕</button>
        <h3 id="popup-label"></h3>
        <p id="popup-summary"></p>
        <button id="delete-node-btn" class="delete-btn">Delete Node</button>
    </div>

    <!-- Edge popup -->
    <div id="edge-popup" class="node-popup hidden">
        <button id="edge-popup-close" class="popup-close">✕</button>
        <h3>Connection</h3>
        <p id="edge-popup-label"></p>
        <button id="delete-edge-btn" class="delete-btn">Delete Connection</button>
    </div>

</div>

<!-- Pass Django variables to JS via data attributes -->
<div id="map-data"
    data-csrf="{{ csrf_token }}"
    data-map-id="{{ custom_map.id }}"
    data-nodes='{{ nodes|safe }}'
    data-edges='{{ edges|safe }}'>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="{% static 'js/homepage.js' %}?v=2"></script>

{% endblock %}
