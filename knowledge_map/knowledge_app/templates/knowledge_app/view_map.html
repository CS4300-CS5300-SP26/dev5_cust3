{% extends "knowledge_app/base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/view_map.css' %}?v=1">
{% endblock %}

{% block content %}

<div class="view-map-wrapper">
    <div class="map-header">
        <h1>{{ knowledge_map.title }}</h1>
        <span class="map-status" id="map-status">{{ knowledge_map.status }}</span>
    </div>

    <!-- Cytoscape.js renders the map here -->
    <div id="cy"></div>

    <!-- Node popup panel shown when a node is clicked -->
    <div id="node-popup" class="node-popup hidden">
        <button id="popup-close" class="popup-close">✕</button>
        <h3 id="popup-label"></h3>
        <p id="popup-summary"></p>
    </div>
    
</div>
<!-- Related Topics Modal -->
<div id="related-modal" class="modal hidden">
    <div class="modal-content">
        <button id="modal-close" class="modal-close">✕</button>
        <h2>Related Research Areas</h2>
        <div id="related-list"><em>Loading suggestions...</em></div>
    </div>
</div>
<!-- Cytoscape.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

<script>
    // Related topics logic with improved error handling
    const relatedUrl = "{% url 'related_topics' knowledge_map.id %}";
    
    function loadRelatedTopics() {
        fetch(relatedUrl)
            .then(r => {
                console.log('Related topics response status:', r.status);
                
                if (!r.ok) {
                    throw new Error(`Server returned ${r.status}`);
                }
                return r.json();
            })
            .then(data => {
                console.log('Related topics data:', data);
                
                const container = document.getElementById('related-list');
                
                // Check for error response
                if (data.error) {
                    console.error('API error:', data.error);
                    container.innerHTML = `<em>Could not load suggestions: ${data.error}</em>`;
                    return;
                }
                
                // Check if data has suggestions
                if (!data.suggestions || !Array.isArray(data.suggestions)) {
                    throw new Error('Invalid data format: missing suggestions array');
                }
                
                if (data.suggestions.length === 0) {
                    container.innerHTML = '<em>No related topics found. Try adding more topics to your map.</em>';
                    return;
                }
                
                container.innerHTML = data.suggestions.map(s => `
                    <div class="suggestion">
                        <strong>${s.title || 'Untitled'}</strong>
                        <p>${s.description || 'No description available'}</p>
                        <a href="https://scholar.google.com/scholar?q=${encodeURIComponent(s.search_query)}" target="_blank">Search on Google Scholar →</a>
                    </div>
                `).join('');
            })
            .catch(error => {
                console.error('Error loading related topics:', error);
                const container = document.getElementById('related-list');
                container.innerHTML = `<em>Could not load suggestions. Check the console for details.</em>`;
            });
    }
 
    // Load related topics when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadRelatedTopics);
    } else {
        loadRelatedTopics();
    }
    
    // @ts-nocheck
    // Map data from Django
    const cyNodes = {{ nodes|safe }};
    const cyEdges = {{ edges|safe }};
    const mapStatus = "{{ knowledge_map.status }}";
    const statusUrl = "{% url 'map_status' knowledge_map.id %}";

    // Initialise Cytoscape
    const cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [...cyNodes, ...cyEdges],
        style: [
            {
                selector: 'node',
                style: {
                    'background-color': '#0e223e',
                    'label': 'data(label)',
                    'color': '#fff',
                    'text-valign': 'center',
                    'text-halign': 'center',
                    'font-size': '12px',
                    'width': '120px',
                    'height': '40px',
                    'shape': 'roundrectangle',
                    'text-wrap': 'wrap',
                    'text-max-width': '110px',
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 2,
                    'line-color': '#9db8dd',
                    'target-arrow-color': '#9db8dd',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier',
                    'label': 'data(label)',
                    'font-size': '10px',
                    'color': '#333',
                }
            }
        ],
        layout: {
            name: 'cose',         // force-directed layout
            animate: true,
            padding: 50
        }
    });

    // Cache DOM elements once to avoid repeated lookups
    const popup = document.getElementById('node-popup');
    const popupLabel = document.getElementById('popup-label');
    const popupSummary = document.getElementById('popup-summary');
    const popupClose = document.getElementById('popup-close');

    // Show popup when a node is clicked
    cy.on('tap', 'node', function(event) {
        const node = event.target;
        popupLabel.textContent = node.data('label') || '';
        popupSummary.textContent = node.data('summary') || '';
        popup.classList.remove('hidden');
    });

    // Close popup when close button is clicked
    popupClose.addEventListener('click', function() {
        popup.classList.add('hidden');
    });

    // Close popup when clicking on the background
    cy.on('tap', function(event) {
        if (event.target === cy) {
            popup.classList.add('hidden');
        }
    });

    // If map is still processing, poll the status every 3 seconds
    if (mapStatus === 'pending' || mapStatus === 'processing') {
        const statusEl = document.getElementById('map-status');

        const poll = setInterval(async () => {
            const response = await fetch(statusUrl);
            const data = await response.json();

            statusEl.textContent = data.status;
            statusEl.className = `map-status ${data.status}`;

            // Reload page when complete to show the map
            if (data.status === 'complete' || data.status === 'failed') {
                clearInterval(poll);
                location.reload();
            }
        }, 3000);
    }
</script>

{% endblock %}
