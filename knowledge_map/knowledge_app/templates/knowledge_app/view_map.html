{% extends "knowledge_app/base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/view_map.css' %}?v=1">
{% endblock %}

{% block content %}

<div class="view-map-wrapper">
    <div class="map-header">
        <h1>{{ knowledge_map.title }}</h1>
        <span class="map-status" id="map-status">{{ knowledge_map.status }}</span>
        <!-- Add node button -->
        <button id="add-node-btn" class="add-node-btn">+ Add Node</button>
        <!-- Add relationship-->
        <button id="add-relationship-btn" class="add-node-btn">+ Add Relationship</button>
    </div>

    <!-- Add node form -->
     <div id="add-node-form" class="add-node-form hidden">
        <input type="text" id="new-node-label" placeholder="Node label (required)">
        <input type="text" id="new-node-summary" placeholder="Node summary (optional)">
        <button id="confirm-add-node" class="confirm-btn">Add</button>
        <button id="cancel-add-node" class="cancel-btn">Cancel</button>
     </div>

    <!--wrapper for side-by-side layout -->
    <div class="map-body">
        <aside class="related-sidebar">
            <h2>Related Research Areas</h2>
            <div id="related-list"><em>Loading suggestions...</em></div>
        </aside>
    </div>
    <!-- Cytoscape.js renders the map here -->
    <div id="cy"></div>

    <!-- Node popup panel shown when a node is clicked -->
    <div id="node-popup" class="node-popup hidden">
        <button id="popup-close" class="popup-close">✕</button>
        <h3 id="popup-label"></h3>
        <p id="popup-summary"></p>
        <button id="delete-node-btn" class="delete-node-btn">Delete Node</button>
    </div>

    <!-- Edge popup shown when a relationship is clicked -->
    <div id="edge-popup" class="node-popup hidden">
        <button id="edge-popup-close" class="popup-close">✕</button>
        <h3>Relationship</h3>
        <p id="edge-popup-label"></p>
        <button id="delete-relationship-btn" class="delete-node-btn">Delete Relationship</button>
    </div>
    <!---added related topics bar-->
    <aside class="related-sidebar">
        <h2> Related Research Areas</h2>
        <div id="related-list"><em>Loading suggestions...</em></div>
      </aside>
</div>

<!-- Cytoscape.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

<script>
    //related topics logic
    const relatedUrl = "{% url 'related_topics' knowledge_map.id %}";

    fetch(relatedUrl)
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('related-list');
            container.innerHTML = data.suggestions.map(s => `
                <div class="suggestion">
                    <strong>${s.title}</strong>
                    <p>${s.description}</p>
                    <a href="https://scholar.google.com/scholar?q=${encodeURIComponent(s.search_query)}" target="_blank">Search on Google Scholar →</a>
                </div>
        `).join('');
        })
    .catch(() => {
    document.getElementById('related-list').innerHTML = '<em>Could not load suggestions.</em>';
    });
    // @ts-nocheck
    // Map data from Django
    const cyNodes = {{ nodes|safe }};
    const cyEdges = {{ edges|safe }};
    const mapStatus = "{{ knowledge_map.status }}";
    const statusUrl = "{% url 'map_status' knowledge_map.id %}";
    const addNodeUrl = "{% url 'add_node' knowledge_map.id %}";
    const csrfToken = "{{ csrf_token }}";

    // Initialise Cytoscape
    const cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [...cyNodes, ...cyEdges],
        style: [
            {
                selector: 'node',
                style: {
                    'background-color': '#0e223e',
                    'label': 'data(label)',
                    'color': '#fff',
                    'text-valign': 'center',
                    'text-halign': 'center',
                    'font-size': '12px',
                    'width': '120px',
                    'height': '40px',
                    'shape': 'roundrectangle',
                    'text-wrap': 'wrap',
                    'text-max-width': '110px',
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 2,
                    'line-color': '#9db8dd',
                    'target-arrow-color': '#9db8dd',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier',
                    'label': 'data(label)',
                    'font-size': '10px',
                    'color': '#333',
                }
            }
        ],
        layout: {
            name: 'cose',         // force-directed layout
            animate: true,
            padding: 50
        }
    });

    // Cache DOM elements once to avoid repeated lookups
    const popup = document.getElementById('node-popup');
    const popupLabel = document.getElementById('popup-label');
    const popupSummary = document.getElementById('popup-summary');
    const popupClose = document.getElementById('popup-close');
    const deleteNodeBtn = document.getElementById('delete-node-btn');
    const addNodeBtn = document.getElementById('add-node-btn');
    const addNodeForm = document.getElementById('add-node-form');
    const confirmAddNode = document.getElementById('confirm-add-node');
    const cancelAddNode = document.getElementById('cancel-add-node');
    const addRelationshipUrl = "{% url 'add_relationship' knowledge_map.id %}";
    const addRelBtn = document.getElementById('add-relationship-btn');
    let selectedEdgeId = null;
    const edgePopup = document.getElementById('edge-popup');
    const edgePopupLabel = document.getElementById('edge-popup-label');
    const edgePopupClose = document.getElementById('edge-popup-close');
    const deleteRelBtn = document.getElementById('delete-relationship-btn');

    // Relationship mode state
    let relationshipMode = false;
    let sourceNode = null;

    // Toggle relationship mode
    addRelBtn.addEventListener('click', function() {
        relationshipMode = !relationshipMode;
        sourceNode = null;

        if (relationshipMode) {
            addRelBtn.textContent = 'Cancel Relationship';
            addRelBtn.style.backgroundColor = '#856404';
            cy.nodes().style('border-width', '2px');
            cy.nodes().style('border-color', '#9db8dd');
        } else {
            addRelBtn.textContent = '+ Add Relationship';
            addRelBtn.style.backgroundColor = '';
            cy.nodes().style('border-width', '0px');
        }
    });


    // Track selected node id for deletion
    let selectedNodeId = null;

    // Handle node clicks in relationship mode
    cy.on('tap', 'node', function(event) {
        const node = event.target;

        if (relationshipMode) {
            if (!sourceNode) {
                // First click - select source node
                sourceNode = node;
                node.style('background-color', '#3b7ddd');
            } else if (sourceNode.id() !== node.id()) {
                // Second click - select target node and prompt for label
                const label = prompt('Enter relationship label (e.g. "leads to", "relates to"):');
                if (!label || !label.trim()) {
                    alert('Relationship label is required.');
                    return;
                }

                // Save relationship to database
                fetch(addRelationshipUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        source_id: sourceNode.data('id'),
                        target_id: node.data('id'),
                        label: label.trim()
                    })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        // Add edge to Cytoscape canvas
                        cy.add({
                            group: 'edges',
                            data: {
                                id: data.id,
                                source: data.source,
                                target: data.target,
                                label: data.label
                            }
                        });
                    }

                    // Reset relationship mode
                    sourceNode.style('background-color', '#0e223e');
                    sourceNode = null;
                    relationshipMode = false;
                    addRelBtn.textContent = '+ Add Relationship';
                    addRelBtn.style.backgroundColor = '';
                    cy.nodes().style('border-width', '0px');
                })
                .catch(() => {
                    alert('Failed to create relationship. Please try again.');
                });
            }
            return;
        }

        // Normal mode - show popup
        selectedNodeId = node.data('id');
        popupLabel.textContent = node.data('label') || '';
        popupSummary.textContent = node.data('summary') || '';
        popup.classList.remove('hidden');
    });

    // Show edge popup when an edge is clicked
    cy.on('tap', 'edge', function(event) {
        if (relationshipMode) return;
        const edge = event.target;
        // Extract numeric id from "e123" format
        selectedEdgeId = edge.data('id').replace('e', '');
        edgePopupLabel.textContent = edge.data('label') || '';
        edgePopup.classList.remove('hidden');
    });

    // Close edge popup
    edgePopupClose.addEventListener('click', function() {
        edgePopup.classList.add('hidden');
        selectedEdgeId = null;
    });

    // Delete relationship
    deleteRelBtn.addEventListener('click', async function() {
        if (!selectedEdgeId) return;
        if (!confirm('Are you sure you want to delete this relationship?')) return;

        const deleteUrl = `/map/{{ knowledge_map.id }}/delete-relationship/${selectedEdgeId}/`;

        const response = await fetch(deleteUrl, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken }
        });

        const data = await response.json();

        if (response.ok) {
            cy.getElementById(`e${selectedEdgeId}`).remove();
            edgePopup.classList.add('hidden');
            selectedEdgeId = null;
        } else {
            alert(data.error || 'Failed to delete relationship.');
        }
    });

    // Close popup when close button is clicked
    popupClose.addEventListener('click', function() {
        popup.classList.add('hidden');
        selectedNodeId = null;
    });

    // Close popup when clicking on the background
    cy.on('tap', function(event) {
        if (event.target === cy) {
            popup.classList.add('hidden');
            selectedNodeId = null;
        }
    });

    // Show add node form when add button is clicked
    addNodeBtn.addEventListener('click', function() {
        addNodeForm.classList.remove('hidden');
        document.getElementById('new-node-label').focus();
    });

    // Hide add node form when cancel is clicked
    cancelAddNode.addEventListener('click', function() {
        addNodeForm.classList.add('hidden');
        document.getElementById('new-node-label').value = '';
        document.getElementById('new-node-summary').value = '';
    });

    // Add node when confirm is clicked
    confirmAddNode.addEventListener('click', async function() {
        const label = document.getElementById('new-node-label').value.trim();
        const summary = document.getElementById('new-node-summary').value.trim();

        if (!label) {
            alert('Please enter a label for the node.');
            return;
        }

        const response = await fetch(addNodeUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ label, summary })
        });

        const data = await response.json();

        if (response.ok) {
            // Add the new node to the Cytoscape canvas
            cy.add({
                group: 'nodes',
                data: { id: data.id, label: data.label, summary: data.summary },
                position: { x: cy.width() / 2, y: cy.height() / 2 }
            });

            // Hide and reset the form
            addNodeForm.classList.add('hidden');
            document.getElementById('new-node-label').value = '';
            document.getElementById('new-node-summary').value = '';
        } else {
            alert(data.error || 'Failed to add node.');
        }
    });

    // Delete node when delete button in popup is clicked
    deleteNodeBtn.addEventListener('click', async function() {
        if (!selectedNodeId) return;

        if (!confirm('Are you sure you want to delete this node?')) return;

        const deleteUrl = `/map/{{ knowledge_map.id }}/delete-node/${selectedNodeId}/`;

        const response = await fetch(deleteUrl, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken
            }
        });

        const data = await response.json();

        if (response.ok) {
            // Remove the node and its connected edges from the canvas
            cy.getElementById(selectedNodeId).remove();
            popup.classList.add('hidden');
            selectedNodeId = null;
        } else {
            alert(data.error || 'Failed to delete node.');
        }
    });

    // If map is still processing, poll the status every 3 seconds
    if (mapStatus === 'pending' || mapStatus === 'processing') {
        const statusEl = document.getElementById('map-status');

        const poll = setInterval(async () => {
            const response = await fetch(statusUrl);
            const data = await response.json();

            statusEl.textContent = data.status;
            statusEl.className = `map-status ${data.status}`;

            // Reload page when complete to show the map
            if (data.status === 'complete' || data.status === 'failed') {
                clearInterval(poll);
                location.reload();
            }
        }, 3000);
    }
</script>

{% endblock %}
