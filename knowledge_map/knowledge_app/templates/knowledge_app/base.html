{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Apply Theme Before Page Load -->
    <script>
        const serverTheme = '{{ dark_mode|yesno:"dark,light" }}';
        localStorage.setItem('theme', serverTheme);
        if (serverTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KnowledgeMap</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Navbar CSS -->
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=2">
    {% block head %}{% endblock %}

    <script>
        const toggle = document.getElementById('dark-mode-toggle');
        if (toggle) {
            toggle.checked = localStorage.getItem('theme') === 'dark';
      
            toggle.addEventListener('change', () => {
                const isDark = toggle.checked;
      
                // 1. Update UI immediately (no waiting for server)
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
      
                // 2. Persist to Django in the background
                fetch("{% url 'update_theme' %}", {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({ dark_mode: isDark }),
                });
            });
        }
    </script>
</head>


<body>

    <div class="wrapper">
        <!-- Include sidebar -->
        {% include "knowledge_app/nav_bar.html" %}

        <!-- Page Content -->
        <div class="main">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <div class="bottom-bar">KnowledgeMap</div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/navbar.js' %}"></script>

</body>
</html>
